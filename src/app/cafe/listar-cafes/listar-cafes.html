
<div class="container mt-4">

  <div class="text-center mb-4">
    <h1 class="titulo-cafe">El aroma mágico</h1>
  </div>

  <div class="mb-4">
    <img
      src="/images/banner-cafe.png"
      alt="Banner de café"
      class="img-fluid w-100 banner-cafe"
    />
  </div>

  <table class="table table-striped">
    <thead class="table-dark">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Nombre</th>
        <th scope="col">Tipo</th>
        <th scope="col">Región</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let cafe of cafes; index as i">
        <td>{{ i + 1 }}</td>
        <td>{{ cafe.nombre }}</td>
        <td>{{ cafe.tipo }}</td>
        <td>{{ cafe.region }}</td>
      </tr>
    </tbody>
  </table>

  <div class="mt-4">
    <p>
      Total café de origen: {{ totalOrigen }}
    </p>

    <p>
      Total café blend: {{ totalBlend }}
    </p>
  </div>

</div>
